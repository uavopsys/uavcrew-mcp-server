name: Build and Push

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - "pyproject.toml"
      - "gunicorn_config.py"
      - "Dockerfile"
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com/uavopsys
  IMAGE_NAME: uavcrew-mcp-server

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image metadata
        id: meta
        run: |
          TAG=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}:${TAG}" >> "$GITHUB_OUTPUT"
          echo "image_latest=${REGISTRY}/${IMAGE_NAME}:latest" >> "$GITHUB_OUTPUT"

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Login to DO Container Registry
        run: doctl registry login --expiry-seconds 600

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push to DO registry
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ steps.meta.outputs.image_latest }}
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image_latest }}
          cache-to: type=inline

      # -----------------------------------------------------------------------
      # GHCR push — enable when ready to distribute to customers
      # -----------------------------------------------------------------------
      # - name: Login to GitHub Container Registry
      #   uses: docker/login-action@v3
      #   with:
      #     registry: ghcr.io
      #     username: ${{ github.actor }}
      #     password: ${{ secrets.GITHUB_TOKEN }}
      #
      # - name: Push to GHCR
      #   run: |
      #     docker buildx imagetools create \
      #       --tag ghcr.io/uavopsys/${IMAGE_NAME}:${{ steps.meta.outputs.tag }} \
      #       --tag ghcr.io/uavopsys/${IMAGE_NAME}:latest \
      #       ${{ steps.meta.outputs.image }}

      - name: Summary
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Build Complete

          | | |
          |---|---|
          | **Image** | \`${{ steps.meta.outputs.image }}\` |
          | **Tag** | \`${TAG}\` |

          ## What's Next

          1. [Deploy to Staging](https://github.com/uavopsys/uavopsys-infra/actions/workflows/deploy-staging.yml) — project: \`uavcrew-mcp-server\`, tag: \`${TAG}\`
          2. Verify at staging URL
          3. [Deploy to Production](https://github.com/uavopsys/uavopsys-infra/actions/workflows/deploy-production.yml) — project: \`uavcrew-mcp-server\`, tag: \`${TAG}\`
          4. Verify at [mcp.uavcrew.ai](https://mcp.uavcrew.ai)
          EOF
