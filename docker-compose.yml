# UAVCrew MCP Gateway — Docker Compose
#
# Setup:
#   pip install uavcrew-mcp-server
#   uavcrew setup --docker       # creates config/ with .env, manifest.json, keys/
#   docker compose up -d
#   curl http://localhost:8400/health
#
services:
  mcp-gateway:
    image: ghcr.io/uavopsys/uavcrew-mcp-server:latest
    container_name: mcp-gateway
    restart: unless-stopped
    ports:
      - "${MCP_PORT:-8400}:8400"
    env_file:
      - ./config/.env
    volumes:
      - ./config/manifest.json:/app/config/manifest.json:ro
      - ./config/keys:/app/config/keys:ro
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=8400
