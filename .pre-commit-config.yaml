# Pre-commit hooks for UAVCrew MCP Server
# Install: pip install pre-commit && pre-commit install && pre-commit install --hook-type pre-push

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: tests
        name: tests
        entry: make test
        language: system
        pass_filenames: false
        stages: [pre-push]
